<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VERTAX | Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #060b0a;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 70px;
      padding: 0 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #08100e;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 800;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg,#39e38c,#159866);
      color: #04120b;
      font-size: 13px;
      font-weight: 900;
    }

    .logout {
      border: 1px solid #2b4039;
      background: transparent;
      color: #aebbb7;
      padding: 9px 15px;
      border-radius: 9px;
      cursor: pointer;
    }

    .logout:hover {
      border-color: #39df8c;
      color: #fff;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: 90%;
      max-width: 1250px;
      margin: auto;
      padding: 35px 0 60px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: clamp(26px,4vw,38px);
      margin-bottom: 8px;
    }

    .welcome p {
      color: #7f908b;
      font-size: 14px;
    }

    /* =========================
       BALANCE
    ========================= */

    .balance-card {
      position: relative;
      overflow: hidden;
      padding: 32px;
      border-radius: 21px;
      background:
        radial-gradient(
          circle at 90% 10%,
          rgba(54,226,139,.18),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #10211c,
          #0a1512
        );
      border: 1px solid rgba(255,255,255,.07);
      margin-bottom: 20px;
    }

    .balance-label {
      color: #94a49f;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .balance {
      font-size: clamp(40px,7vw,65px);
      font-weight: 800;
      letter-spacing: -2px;
    }

    .currency {
      font-size: 14px;
      color: #81918c;
      margin-left: 5px;
      letter-spacing: 0;
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      padding: 21px;
      background: #0b1512;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 15px;
    }

    .stat-label {
      color: #81908b;
      font-size: 12px;
      margin-bottom: 9px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
    }

    .green {
      color: #49df92;
    }

    /* =========================
       PANELS
    ========================= */

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .panel {
      background: #0b1512;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 17px;
      overflow: hidden;
    }

    .panel-header {
      padding: 20px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .panel-header h2 {
      font-size: 16px;
    }

    .panel-header span {
      color: #71817c;
      font-size: 11px;
    }

    /* =========================
       HISTORY
    ========================= */

    .activity {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,.045);
      gap: 15px;
    }

    .activity:last-child {
      border-bottom: none;
    }

    .asset {
      font-size: 13px;
      font-weight: 700;
    }

    .description {
      color: #7b8985;
      font-size: 11px;
      margin-top: 4px;
    }

    .date {
      color: #626f6b;
      font-size: 10px;
      margin-top: 4px;
    }

    .profit {
      color: #49df92;
      font-weight: 700;
      white-space: nowrap;
    }

    .loss {
      color: #ff7d7d;
      font-weight: 700;
      white-space: nowrap;
    }

    .pending {
      color: #e2bd65;
    }

    .approved {
      color: #49df92;
    }

    .declined {
      color: #ff7d7d;
    }

    .empty {
      padding: 42px 20px;
      text-align: center;
      color: #687773;
      font-size: 13px;
    }

    /* =========================
       DEPOSIT BUTTON
    ========================= */

    .deposit-button {
      border: none;
      background: linear-gradient(135deg,#39df8c,#149b68);
      color: #03110a;
      font-weight: 800;
      padding: 9px 14px;
      border-radius: 9px;
      cursor: pointer;
    }

    .deposit-button:hover {
      filter: brightness(1.08);
    }

    /* =========================
       LOADING
    ========================= */

    #loading {
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #91a09c;
      font-size: 14px;
    }

    #dashboard {
      display: none;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width:750px) {

      header {
        padding: 0 18px;
      }

      main {
        width: calc(100% - 30px);
        padding-top: 25px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .balance-card {
        padding: 25px 20px;
      }

      .balance {
        font-size: 43px;
      }

      .panel-header {
        padding: 17px;
      }

      .activity {
        padding: 15px 17px;
      }
    }
  </style>
</head>

<body>

  <!-- LOADING -->

  <div id="loading">
    Loading VERTAX...
  </div>


  <!-- DASHBOARD -->

  <div id="dashboard">

    <header>

      <div class="brand">

        <div class="logo">
          VX
        </div>

        VERTAX

      </div>

      <button
        class="logout"
        onclick="logout()"
      >
        Logout
      </button>

    </header>


    <main>

      <!-- WELCOME -->

      <section class="welcome">

        <h1>
          Welcome,
          <span id="username">User</span>
        </h1>

        <p>
          Here's an overview of your VERTAX account.
        </p>

      </section>


      <!-- BALANCE -->

      <section class="balance-card">

        <div class="balance-label">
          Available Balance
        </div>

        <div class="balance">

          $<span id="balance">
            0.00
          </span>

          <span class="currency">
            USDT
          </span>

        </div>

      </section>


      <!-- STATISTICS -->

      <section class="stats">

        <div class="stat">

          <div class="stat-label">
            Total Profit
          </div>

          <div
            class="stat-value green"
            id="totalProfit"
          >
            $0.00
          </div>

        </div>


        <div class="stat">

          <div class="stat-label">
            Total Trades
          </div>

          <div
            class="stat-value"
            id="totalTrades"
          >
            0
          </div>

        </div>


        <div class="stat">

          <div class="stat-label">
            Account Status
          </div>

          <div
            class="stat-value green"
            id="accountStatus"
          >
            Active
          </div>

        </div>

      </section>


      <!-- HISTORY -->

      <section class="grid">


        <!-- TRADING HISTORY -->

        <div class="panel">

          <div class="panel-header">

            <h2>
              Profit & Trade History
            </h2>

            <span>
              GOLD / USDT
            </span>

          </div>

          <div id="tradeHistory">

            <div class="empty">
              No trading activity yet.
            </div>

          </div>

        </div>


        <!-- DEPOSIT HISTORY -->

        <div class="panel">

          <div class="panel-header">

            <h2>
              Deposit History
            </h2>

            <button
              class="deposit-button"
              onclick="openDeposit()"
            >
              Deposit USDT
            </button>

          </div>

          <div id="depositHistory">

            <div class="empty">
              No deposits yet.
            </div>

          </div>

        </div>


      </section>

    </main>

  </div>


<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://eqggkzwenddrscuborlo.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_anum8CtI4AsIFBkxjJAWIQ_-1B9laW1";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // LOAD DASHBOARD
  // ==========================================

  async function loadDashboard() {

    const {
      data: {
        user
      },
      error: authError
    } =
      await supabaseClient.auth.getUser();


    if (authError || !user) {

      window.location.href =
        "index.html";

      return;
    }


    // Get ONLY the logged-in user's profile

    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .single();


    if (profileError) {

      console.error(profileError);

      document.getElementById(
        "loading"
      ).textContent =
        "Unable to load your profile.";

      return;
    }


    document.getElementById(
      "username"
    ).textContent =
      profile.username ||
      profile.full_name ||
      "User";


    document.getElementById(
      "balance"
    ).textContent =
      Number(
        profile.balance || 0
      ).toFixed(2);


    await loadTrades(user.id);

    await loadDeposits(user.id);


    document.getElementById(
      "loading"
    ).style.display = "none";

    document.getElementById(
      "dashboard"
    ).style.display = "block";
  }


  // ==========================================
  // TRADING HISTORY
  // ==========================================

  async function loadTrades(userId) {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("trade_history")
        .select("*")
        .eq("user_id", userId)
        .order("created_at", {
          ascending: false
        });


    if (error) {

      console.error(error);

      return;
    }


    const container =
      document.getElementById(
        "tradeHistory"
      );


    if (!data || data.length === 0) {

      container.innerHTML =
        '<div class="empty">No trading activity yet.</div>';

      return;
    }


    let totalProfit = 0;


    container.innerHTML =
      data.map(function(trade) {

        const amount =
          Number(
            trade.amount || 0
          );


        const isProfit =
          trade.trade_type === "profit";


        if (isProfit) {

          totalProfit += amount;

        } else {

          totalProfit -= amount;

        }


        const sign =
          isProfit
            ? "+"
            : "-";


        const className =
          isProfit
            ? "profit"
            : "loss";


        const date =
          new Date(
            trade.created_at
          ).toLocaleString();


        return `

          <div class="activity">

            <div>

              <div class="asset">
                ${escapeHtml(
                  trade.asset ||
                  "GOLD/USDT"
                )}
              </div>

              <div class="description">
                ${escapeHtml(
                  trade.description ||
                  "Trading activity"
                )}
              </div>

              <div class="date">
                ${date}
              </div>

            </div>

            <div class="${className}">
              ${sign}$${amount.toFixed(2)}
            </div>

          </div>

        `;

      }).join("");


    document.getElementById(
      "totalTrades"
    ).textContent =
      data.length;


    document.getElementById(
      "totalProfit"
    ).textContent =
      "$" + totalProfit.toFixed(2);
  }


  // ==========================================
  // DEPOSIT HISTORY
  // ==========================================

  async function loadDeposits(userId) {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("deposits")
        .select("*")
        .eq("user_id", userId)
        .order("created_at", {
          ascending: false
        });


    if (error) {

      console.error(error);

      return;
    }


    const container =
      document.getElementById(
        "depositHistory"
      );


    if (!data || data.length === 0) {

      container.innerHTML =
        '<div class="empty">No deposits yet.</div>';

      return;
    }


    container.innerHTML =
      data.map(function(deposit) {

        const date =
          new Date(
            deposit.created_at
          ).toLocaleString();


        const status =
          String(
            deposit.status || "pending"
          ).toLowerCase();


        return `

          <div class="activity">

            <div>

              <div class="asset">
                ${escapeHtml(
                  deposit.currency ||
                  "USDT"
                )}
              </div>

              <div class="date">
                ${date}
              </div>

            </div>

            <div>

              $${Number(
                deposit.amount || 0
              ).toFixed(2)}

              <br>

              <small class="${status}">
                ${escapeHtml(status)}
              </small>

            </div>

          </div>

        `;

      }).join("");
  }


  // ==========================================
  // DEPOSIT BUTTON
  // ==========================================

  function openDeposit() {

    alert(
      "The USDT deposit page will be connected in the next step."
    );
  }


  // ==========================================
  // LOGOUT
  // ==========================================

  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
      "index.html";
  }


  // ==========================================
  // SAFE TEXT DISPLAY
  // ==========================================

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;")
      .replace(/'/g,"&#039;");
  }


  // ==========================================
  // START
  // ==========================================

  loadDashboard();

</script>

</body>
</html>
