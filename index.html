<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>VERTAX | Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #060b0a;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      min-height: 100vh;
    }

    /* HEADER */

    header {
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      border-bottom: 1px solid rgba(255,255,255,.07);
      background: #08100e;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 20px;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg,#39e38c,#159866);
      color: #04120b;
      font-weight: 900;
    }

    .logout {
      border: 1px solid #294039;
      background: transparent;
      color: #a9b8b4;
      padding: 9px 15px;
      border-radius: 9px;
      cursor: pointer;
    }

    /* MAIN */

    main {
      width: 90%;
      max-width: 1250px;
      margin: 0 auto;
      padding: 35px 0 60px;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: clamp(25px, 4vw, 36px);
      margin-bottom: 7px;
    }

    .welcome p {
      color: #7f908b;
      font-size: 14px;
    }

    /* BALANCE */

    .balance-card {
      position: relative;
      overflow: hidden;
      padding: 30px;
      border-radius: 20px;
      background:
        radial-gradient(circle at 90% 10%,rgba(54,226,139,.18),transparent 35%),
        linear-gradient(135deg,#10211c,#0a1512);
      border: 1px solid rgba(255,255,255,.07);
      margin-bottom: 20px;
    }

    .balance-label {
      color: #94a49f;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .balance {
      font-size: clamp(38px, 7vw, 64px);
      font-weight: 800;
      letter-spacing: -2px;
    }

    .currency {
      font-size: 14px;
      color: #81918c;
      margin-left: 5px;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      background: #0b1512;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 15px;
      padding: 20px;
    }

    .stat-label {
      color: #81908b;
      font-size: 12px;
      margin-bottom: 9px;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 700;
    }

    /* GRID */

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .panel {
      background: #0b1512;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 17px;
      overflow: hidden;
    }

    .panel-header {
      padding: 20px;
      border-bottom: 1px solid rgba(255,255,255,.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-header h2 {
      font-size: 16px;
    }

    .panel-header span {
      color: #71817c;
      font-size: 12px;
    }

    .empty {
      padding: 40px 20px;
      text-align: center;
      color: #697873;
      font-size: 13px;
    }

    /* ACTIVITY */

    .activity {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,.045);
    }

    .activity:last-child {
      border-bottom: 0;
    }

    .asset {
      font-weight: 700;
      font-size: 13px;
    }

    .date {
      color: #687772;
      font-size: 11px;
      margin-top: 4px;
    }

    .profit {
      color: #48df92;
      font-weight: 700;
    }

    .loss {
      color: #ff7d7d;
      font-weight: 700;
    }

    /* DEPOSIT */

    .deposit-button {
      border: none;
      background: linear-gradient(135deg,#39df8c,#149b68);
      color: #03110a;
      font-weight: 800;
      padding: 10px 15px;
      border-radius: 9px;
      cursor: pointer;
    }

    /* LOADING */

    #loading {
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #8d9d98;
    }

    #dashboard {
      display: none;
    }

    /* MOBILE */

    @media (max-width: 750px) {

      header {
        padding: 0 18px;
      }

      main {
        width: calc(100% - 30px);
        padding-top: 25px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .balance-card {
        padding: 25px 20px;
      }

      .balance {
        font-size: 43px;
      }

      .panel-header {
        padding: 17px;
      }
    }
  </style>
</head>

<body>

<div id="loading">
  Loading VERTAX...
</div>


<div id="dashboard">

  <header>

    <div class="brand">

      <div class="logo">
        VX
      </div>

      VERTAX

    </div>

    <button
      class="logout"
      onclick="logout()"
    >
      Logout
    </button>

  </header>


  <main>

    <section class="welcome">

      <h1>
        Welcome, <span id="username">User</span>
      </h1>

      <p>
        Here's an overview of your VERTAX trading account.
      </p>

    </section>


    <!-- BALANCE -->

    <section class="balance-card">

      <div class="balance-label">
        Available Balance
      </div>

      <div class="balance">

        $<span id="balance">
          0.00
        </span>

        <span class="currency">
          USDT
        </span>

      </div>

    </section>


    <!-- STATS -->

    <section class="stats">

      <div class="stat">

        <div class="stat-label">
          Total Profit
        </div>

        <div
          class="stat-value"
          id="totalProfit"
        >
          $0.00
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          Total Trades
        </div>

        <div
          class="stat-value"
          id="totalTrades"
        >
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-label">
          Account Status
        </div>

        <div
          class="stat-value"
          id="accountStatus"
        >
          Active
        </div>

      </div>

    </section>


    <!-- CONTENT -->

    <section class="grid">


      <!-- TRADING HISTORY -->

      <div class="panel">

        <div class="panel-header">

          <h2>
            Trading History
          </h2>

          <span>
            GOLD / USDT
          </span>

        </div>

        <div id="tradeHistory">

          <div class="empty">
            No trading activity yet.
          </div>

        </div>

      </div>


      <!-- DEPOSITS -->

      <div class="panel">

        <div class="panel-header">

          <h2>
            Deposit History
          </h2>

          <button
            class="deposit-button"
            onclick="alert('Deposit page will be added next.')"
          >
            Deposit USDT
          </button>

        </div>

        <div id="depositHistory">

          <div class="empty">
            No deposits yet.
          </div>

        </div>

      </div>


    </section>

  </main>

</div>


<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://eqggkzwenddrscuborlo.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_anum8CtI4AsIFBkxjJAWIQ_-1B9laW1";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // LOAD USER
  // ==========================================

  async function loadDashboard() {

    const {
      data: { user },
      error: authError
    } =
      await supabaseClient.auth.getUser();


    if (authError || !user) {

      window.location.href =
        "index.html";

      return;
    }


    // Get this user's profile only

    const {
      data: profile,
      error
    } =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .single();


    if (error) {

      console.error(error);

      alert(
        "Unable to load your profile."
      );

      return;
    }


    document
      .getElementById("username")
      .textContent =
      profile.username ||
      profile.full_name ||
      "User";


    document
      .getElementById("balance")
      .textContent =
      Number(profile.balance || 0)
      .toFixed(2);


    await loadTrades(user.id);

    await loadDeposits(user.id);


    document
      .getElementById("loading")
      .style.display = "none";

    document
      .getElementById("dashboard")
      .style.display = "block";
  }


  // ==========================================
  // LOAD TRADES
  // ==========================================

  async function loadTrades(userId) {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("trade_history")
        .select("*")
        .eq("user_id", userId)
        .order("created_at", {
          ascending: false
        });


    if (error) {

      console.error(error);

      return;
    }


    const container =
      document.getElementById(
        "tradeHistory"
      );


    if (!data || data.length === 0) {

      container.innerHTML =
        '<div class="empty">No trading activity yet.</div>';

      document
        .getElementById("totalTrades")
        .textContent = "0";

      return;
    }


    let totalProfit = 0;


    container.innerHTML =
      data.map(trade => {

        const amount =
          Number(trade.amount || 0);


        const isProfit =
          trade.trade_type === "profit";


        if (isProfit) {

          totalProfit += amount;

        } else {

          totalProfit -= amount;

        }


        const sign =
          isProfit ? "+" : "-";


        const className =
          isProfit ? "profit" : "loss";


        const date =
          new Date(
            trade.created_at
          ).toLocaleDateString();


        return `

          <div class="activity">

            <div>

              <div class="asset">
                ${escapeHtml(
                  trade.asset ||
                  "GOLD/USDT"
                )}
              </div>

              <div class="date">
                ${date}
              </div>

            </div>

            <div class="${className}">
              ${sign}$${amount.toFixed(2)}
            </div>

          </div>

        `;

      }).join("");


    document
      .getElementById("totalTrades")
      .textContent =
      data.length;


    document
      .getElementById("totalProfit")
      .textContent =
      "$" + totalProfit.toFixed(2);
  }


  // ==========================================
  // LOAD DEPOSITS
  // ==========================================

  async function loadDeposits(userId) {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("deposits")
        .select("*")
        .eq("user_id", userId)
        .order("created_at", {
          ascending: false
        });


    if (error) {

      console.error(error);

      return;
    }


    const container =
      document.getElementById(
        "depositHistory"
      );


    if (!data || data.length === 0) {

      container.innerHTML =
        '<div class="empty">No deposits yet.</div>';

      return;
    }


    container.innerHTML =
      data.map(deposit => {

        const date =
          new Date(
            deposit.created_at
          ).toLocaleDateString();


        return `

          <div class="activity">

            <div>

              <div class="asset">
                ${deposit.currency || "USDT"}
              </div>

              <div class="date">
                ${date}
              </div>

            </div>

            <div>
              $${Number(
                deposit.amount || 0
              ).toFixed(2)}
              <br>
              <small>
                ${escapeHtml(
                  deposit.status
                )}
              </small>
            </div>

          </div>

        `;

      }).join("");
  }


  // ==========================================
  // LOGOUT
  // ==========================================

  async function logout() {

    await supabaseClient.auth.signOut();

    window.location.href =
      "index.html";
  }


  // ==========================================
  // SECURITY — ESCAPE DISPLAYED TEXT
  // ==========================================

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  // ==========================================
  // START
  // ==========================================

  loadDashboard();

</script>

</body>
</html>
